name: mail model

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  tlc:
    name: mail TLC
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Check the model, then require each break flag to exit 1
        run: |
          python3 verification/mail-entry/check.py
          set +e
          python3 verification/mail-entry/check.py --break-dedupe
          dedupe_status=$?
          python3 verification/mail-entry/check.py --break-bare
          bare_status=$?
          python3 verification/mail-entry/check.py --break-success
          success_status=$?
          python3 verification/mail-entry/check.py --break-stop
          stop_status=$?
          python3 verification/mail-entry/check.py --break-link
          link_status=$?
          python3 verification/mail-entry/check.py --break-no-provider
          no_provider_status=$?
          python3 verification/mail-entry/check.py --break-two-sends
          two_sends_status=$?
          python3 verification/mail-entry/check.py --break-resend
          resend_status=$?
          set -e
          test "$dedupe_status" -eq 1
          test "$bare_status" -eq 1
          test "$success_status" -eq 1
          test "$stop_status" -eq 1
          test "$link_status" -eq 1
          test "$no_provider_status" -eq 1
          test "$two_sends_status" -eq 1
          test "$resend_status" -eq 1
