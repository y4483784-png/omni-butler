name: mail model

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  tlc:
    name: mail TLC
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Check the model, then require each break flag to exit 1
        run: |
          python3 verification/mail-entry/check.py
          set +e
          python3 verification/mail-entry/check.py --break-dedupe
          dedupe_status=$?
          python3 verification/mail-entry/check.py --break-bare
          bare_status=$?
          python3 verification/mail-entry/check.py --break-success
          success_status=$?
          python3 verification/mail-entry/check.py --break-stop
          stop_status=$?
          python3 verification/mail-entry/check.py --break-link
          link_status=$?
          python3 verification/mail-entry/check.py --break-no-provider
          no_provider_status=$?
          python3 verification/mail-entry/check.py --break-two-sends
          two_sends_status=$?
          python3 verification/mail-entry/check.py --break-resend
          resend_status=$?
          python3 verification/mail-entry/check.py --break-attempt-repair
          attempt_status=$?
          python3 verification/mail-entry/check.py --break-lookup-repair
          lookup_status=$?
          python3 verification/mail-entry/check.py --break-reconcile-send
          reconcile_send_status=$?
          python3 verification/mail-entry/check.py --break-split-write
          split_status=$?
          python3 verification/mail-entry/check.py --break-drop-seal
          drop_seal_status=$?
          python3 verification/mail-entry/check.py --break-unseal
          unseal_status=$?
          python3 verification/mail-entry/check.py --reach refuse
          refuse_status=$?
          python3 verification/mail-entry/check.py --reach attempt
          attempt_refuse_status=$?
          python3 verification/mail-entry/check.py --reach no-transport
          no_transport_status=$?
          python3 verification/mail-entry/check.py --reach lookup-accept
          lookup_accept_status=$?
          python3 verification/mail-entry/check.py --reach lookup-miss
          lookup_miss_status=$?
          python3 verification/mail-entry/check.py --reach legacy
          legacy_status=$?
          python3 verification/mail-entry/check.py --reach reseal
          reseal_status=$?
          set -e
          test "$dedupe_status" -eq 1
          test "$bare_status" -eq 1
          test "$success_status" -eq 1
          test "$stop_status" -eq 1
          test "$link_status" -eq 1
          test "$no_provider_status" -eq 1
          test "$two_sends_status" -eq 1
          test "$resend_status" -eq 1
          test "$attempt_status" -eq 1
          test "$lookup_status" -eq 1
          test "$reconcile_send_status" -eq 1
          test "$split_status" -eq 1
          test "$drop_seal_status" -eq 1
          test "$unseal_status" -eq 1
          test "$refuse_status" -eq 1
          test "$attempt_refuse_status" -eq 1
          test "$no_transport_status" -eq 1
          test "$lookup_accept_status" -eq 1
          test "$lookup_miss_status" -eq 1
          test "$legacy_status" -eq 1
          test "$reseal_status" -eq 1
