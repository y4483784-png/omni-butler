name: desktop model

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  tlc:
    name: desktop TLC
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Check the model, then require each break flag to exit 1
        run: |
          set -e
          python3 verification/desktop/check.py
          set +e
          python3 verification/desktop/check.py --break-again
          again_status=$?
          python3 verification/desktop/check.py --break-path
          path_status=$?
          python3 verification/desktop/check.py --break-unknown
          unknown_status=$?
          python3 verification/desktop/check.py --break-other
          other_status=$?
          python3 verification/desktop/check.py --break-probe
          probe_status=$?
          python3 verification/desktop/check.py --break-stopped
          stopped_status=$?
          python3 verification/desktop/check.py --break-web
          web_status=$?
          set -e
          test "$again_status" -eq 1
          test "$path_status" -eq 1
          test "$unknown_status" -eq 1
          test "$other_status" -eq 1
          test "$probe_status" -eq 1
          test "$stopped_status" -eq 1
          test "$web_status" -eq 1
