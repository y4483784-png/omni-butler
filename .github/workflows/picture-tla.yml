name: picture model

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  tlc:
    name: picture TLC
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Check the model, then require each break flag to exit 1
        run: |
          python3 verification/picture/check.py
          set +e
          python3 verification/picture/check.py --break-ocr
          ocr_status=$?
          python3 verification/picture/check.py --break-zero
          zero_status=$?
          python3 verification/picture/check.py --break-early-blob
          early_blob_status=$?
          python3 verification/picture/check.py --break-revert
          revert_status=$?
          python3 verification/picture/check.py --break-leak
          leak_status=$?
          set -e
          test "$ocr_status" -eq 1
          test "$zero_status" -eq 1
          test "$early_blob_status" -eq 1
          test "$revert_status" -eq 1
          test "$leak_status" -eq 1
