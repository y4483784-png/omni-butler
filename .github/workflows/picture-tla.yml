name: picture model

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  tlc:
    name: picture TLC
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Check the model, then require the zero break to exit 1
        run: |
          python3 verification/picture/check.py
          set +e
          python3 verification/picture/check.py --break-zero
          break_status=$?
          set -e
          test "$break_status" -eq 1
