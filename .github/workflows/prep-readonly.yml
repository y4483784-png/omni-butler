name: prep readonly lock

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  lock:
    name: prep path is read-only
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Default passes, injects exit 1, strip exits 2
        run: |
          python3 verification/prep-readonly/check.py
          set +e
          python3 verification/prep-readonly/check.py --inject-write
          write_status=$?
          python3 verification/prep-readonly/check.py --inject-send
          send_status=$?
          python3 verification/prep-readonly/check.py --strip-lock
          strip_status=$?
          set -e
          test "$write_status" -eq 1
          test "$send_status" -eq 1
          test "$strip_status" -eq 2
