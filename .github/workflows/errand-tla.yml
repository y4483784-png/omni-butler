name: errand model

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  tlc:
    name: errand TLC
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Check the model, then require each break flag to exit 1
        run: |
          python3 verification/errand-place/check.py
          set +e
          python3 verification/errand-place/check.py --break-bare
          bare_status=$?
          python3 verification/errand-place/check.py --break-unpaid
          unpaid_status=$?
          python3 verification/errand-place/check.py --break-success
          success_status=$?
          python3 verification/errand-place/check.py --break-again
          again_status=$?
          python3 verification/errand-place/check.py --break-seen
          seen_status=$?
          python3 verification/errand-place/check.py --break-page
          page_status=$?
          python3 verification/errand-place/check.py --break-wall
          wall_status=$?
          python3 verification/errand-place/check.py --break-stop
          stop_status=$?
          python3 verification/errand-place/check.py --break-empty-echo
          empty_status=$?
          python3 verification/errand-place/check.py --break-lookup-place
          lookup_status=$?
          python3 verification/errand-place/check.py --break-secrets
          secrets_status=$?
          set -e
          test "$bare_status" -eq 1
          test "$unpaid_status" -eq 1
          test "$success_status" -eq 1
          test "$again_status" -eq 1
          test "$seen_status" -eq 1
          test "$page_status" -eq 1
          test "$wall_status" -eq 1
          test "$stop_status" -eq 1
          test "$empty_status" -eq 1
          test "$lookup_status" -eq 1
          test "$secrets_status" -eq 1
