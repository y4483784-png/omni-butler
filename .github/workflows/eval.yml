name: eval

# Two tiers:
#  - offline: hermetic. No LLM, no MinIO/Qdrant, no Docker. Runs on every push.
#  - rls: Postgres service container; exercises the row-level-security isolation
#         test that is skipped on SQLite.
# Suites that need an LLM key or Compose middleware stay manual.
# workflow_dispatch runs the offline smokes (lint, pytest, rag, tabular, context).

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

defaults:
  run:
    working-directory: backend

jobs:
  offline:
    name: offline tests + dataset contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Dataset contracts (schema, distribution, gold references)
        run: python scripts/lint_eval_datasets.py

      - name: Offline test suite
        env:
          DATABASE_URL: sqlite+pysqlite:///./ci-eval.db
          REDIS_ENABLED: "false"
          CELERY_TASK_ALWAYS_EAGER: "true"
          SANDBOX_RUNNER_URL: ""
          SECRET_KEY: test-secret-key
          ADMIN_PASSWORD: test-admin-pass
        run: python -m pytest tests -q

  rls:
    name: postgres row-level security
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: omni
          POSTGRES_PASSWORD: omni
          POSTGRES_DB: omni_butler
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U omni -d omni_butler"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      # Migrations stay on the container superuser (table owner). Same split as
      # Compose: DATABASE_MIGRATE_URL=omni, runtime DATABASE_URL=omni_app.
      - name: Apply migrations (creates the RLS policies)
        env:
          DATABASE_URL: postgresql+psycopg://omni:omni@localhost:5432/omni_butler
          DATABASE_MIGRATE_URL: postgresql+psycopg://omni:omni@localhost:5432/omni_butler
          SECRET_KEY: test-secret-key
          ADMIN_PASSWORD: test-admin-pass
        run: alembic upgrade head

      # Superusers bypass FORCE RLS. Create the non-superuser login before pytest
      # so SessionLocal matches production (ensure_app_role no-ops if the URLs match).
      - name: Ensure non-superuser app role
        env:
          DATABASE_URL: postgresql+psycopg://omni_app:omni@localhost:5432/omni_butler
          DATABASE_MIGRATE_URL: postgresql+psycopg://omni:omni@localhost:5432/omni_butler
          SECRET_KEY: test-secret-key
          ADMIN_PASSWORD: test-admin-pass
        run: python -c "from app.core.db import ensure_app_role; ensure_app_role()"

      - name: Row-level security isolation
        env:
          DATABASE_URL: postgresql+psycopg://omni_app:omni@localhost:5432/omni_butler
          DATABASE_MIGRATE_URL: postgresql+psycopg://omni:omni@localhost:5432/omni_butler
          REDIS_ENABLED: "false"
          SECRET_KEY: test-secret-key
          ADMIN_PASSWORD: test-admin-pass
        run: python -m pytest tests/test_rls_postgres.py -q

  eval-smoke:
    name: offline eval smoke
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Dataset lint
        run: python scripts/lint_eval_datasets.py

      - name: Offline smokes (no Compose, no paid LLM)
        env:
          DATABASE_URL: sqlite+pysqlite:///./ci-eval.db
          REDIS_ENABLED: "false"
          CELERY_TASK_ALWAYS_EAGER: "true"
          SANDBOX_RUNNER_URL: ""
          SECRET_KEY: test-secret-key
          ADMIN_PASSWORD: test-admin-pass
          LLM_API_KEY: ""
          OPENAI_API_KEY: ""
        run: |
          python scripts/eval.py run pytest --profile smoke
          python scripts/eval.py run rag --profile smoke
          python scripts/eval.py run tabular --profile smoke
          python scripts/eval.py run context --profile smoke
