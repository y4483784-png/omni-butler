name: eval

# Two tiers:
#  - offline: hermetic. No LLM, no MinIO/Qdrant, no Docker. Runs on every push.
#  - rls: Postgres service container; exercises the row-level-security isolation
#         test that is skipped on SQLite.
# The eval suites that need LLM keys or Compose middleware are manual-only.

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

defaults:
  run:
    working-directory: omni-butler/backend

jobs:
  offline:
    name: offline tests + dataset contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: omni-butler/backend/requirements*.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Dataset contracts (schema, distribution, gold references)
        run: python scripts/lint_eval_datasets.py

      - name: Offline test suite
        env:
          DATABASE_URL: sqlite+pysqlite:///:memory:
          REDIS_ENABLED: "false"
          CELERY_TASK_ALWAYS_EAGER: "true"
          SANDBOX_RUNNER_URL: ""
          SECRET_KEY: test-secret-key
          ADMIN_PASSWORD: test-admin-pass
        run: python -m pytest tests -q

  rls:
    name: postgres row-level security
    runs-on: ubuntu-latest
    # Checkout is the repo root (backend/ lives here). The workflow-level
    # default still points at omni-butler/backend, which this repo does not have.
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: omni
          POSTGRES_PASSWORD: omni
          POSTGRES_DB: omni_butler
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U omni -d omni_butler"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      # Migrations stay on the container superuser (table owner). Same split as
      # Compose: DATABASE_MIGRATE_URL=omni, runtime DATABASE_URL=omni_app.
      - name: Apply migrations (creates the RLS policies)
        env:
          DATABASE_URL: postgresql+psycopg://omni:omni@localhost:5432/omni_butler
          DATABASE_MIGRATE_URL: postgresql+psycopg://omni:omni@localhost:5432/omni_butler
          SECRET_KEY: test-secret-key
          ADMIN_PASSWORD: test-admin-pass
        run: alembic upgrade head

      # Superusers bypass FORCE RLS. Create the non-superuser login before pytest
      # so SessionLocal matches production (ensure_app_role no-ops if the URLs match).
      - name: Ensure non-superuser app role
        env:
          DATABASE_URL: postgresql+psycopg://omni_app:omni@localhost:5432/omni_butler
          DATABASE_MIGRATE_URL: postgresql+psycopg://omni:omni@localhost:5432/omni_butler
          SECRET_KEY: test-secret-key
          ADMIN_PASSWORD: test-admin-pass
        run: python -c "from app.core.db import ensure_app_role; ensure_app_role()"

      - name: Row-level security isolation
        env:
          DATABASE_URL: postgresql+psycopg://omni_app:omni@localhost:5432/omni_butler
          DATABASE_MIGRATE_URL: postgresql+psycopg://omni:omni@localhost:5432/omni_butler
          REDIS_ENABLED: "false"
          SECRET_KEY: test-secret-key
          ADMIN_PASSWORD: test-admin-pass
        run: python -m pytest tests/test_rls_postgres.py -q

  eval-smoke:
    name: eval suites smoke (needs LLM key + middleware)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Placeholder
        run: |
          echo "Run these from a Compose host with LLM_API_KEY and the middleware up:"
          echo "  export GIT_SHA=\$(git rev-parse --short HEAD)"
          echo "  docker compose --profile eval run --rm eval python scripts/eval.py run routing --profile smoke"
          echo "  docker compose --profile eval run --rm eval python scripts/eval.py run rag --profile smoke"
          echo "  docker compose --profile eval run --rm eval python scripts/eval.py run tabular --profile smoke"
          echo "  docker compose --profile eval run --rm eval python scripts/eval.py run context --profile smoke"
          echo "  docker compose --profile eval run --rm eval python scripts/eval.py run agent --profile smoke"
