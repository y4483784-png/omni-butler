name: watch model

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  tlc:
    name: watch TLC
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Check the model, then require each break flag to exit 1
        run: |
          python3 verification/watch/check.py
          set +e
          python3 verification/watch/check.py --break-stop
          stop_status=$?
          python3 verification/watch/check.py --break-double
          double_status=$?
          python3 verification/watch/check.py --break-wait
          wait_status=$?
          set -e
          test "$stop_status" -eq 1
          test "$double_status" -eq 1
          test "$wait_status" -eq 1
