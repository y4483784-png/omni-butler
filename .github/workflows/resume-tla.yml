name: resume model

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  tlc:
    name: resume TLC
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Check the resume model
        run: |
          python3 verification/resume/check.py
          python3 verification/resume/check.py --stop-on-disconnect
          python3 verification/resume/check.py --hold-without-reserve
          python3 verification/resume/check.py --publish-during-crash
          python3 verification/resume/check.py --reclaim-live
          python3 verification/resume/check.py --model-before-calls
          python3 verification/resume/check.py --allow-resend
          python3 verification/resume/check.py --allow-stale
          python3 verification/resume/check.py --allow-dirty
          python3 verification/resume/check.py --drop-recover
