name: devices model

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  tlc:
    name: devices TLC
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Check the model, then require each break flag to exit 1
        run: |
          set -e
          python3 verification/devices/check.py
          set +e
          python3 verification/devices/check.py --break-hash
          hash_status=$?
          python3 verification/devices/check.py --break-revoke
          revoke_status=$?
          python3 verification/devices/check.py --break-spoof
          spoof_status=$?
          python3 verification/devices/check.py --break-confirm
          confirm_status=$?
          set -e
          test "$hash_status" -eq 1
          test "$revoke_status" -eq 1
          test "$spoof_status" -eq 1
          test "$confirm_status" -eq 1
