name: followup confirm model

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  tlc:
    name: follow-up confirm TLC
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Check the model, then show the claim guard can fail
        run: |
          python3 verification/followup-confirm/check.py
          python3 verification/followup-confirm/check.py --break-claim
