name: schedule confirm model

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  tlc:
    name: schedule confirm TLC
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Check the model, then require each break flag to exit 1
        run: |
          python3 verification/schedule-confirm/check.py
          set +e
          python3 verification/schedule-confirm/check.py --break-submit-gate
          gate_status=$?
          python3 verification/schedule-confirm/check.py --break-confirmed-lock
          lock_status=$?
          set -e
          test "$gate_status" -eq 1
          test "$lock_status" -eq 1
