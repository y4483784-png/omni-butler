name: search model

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  tlc:
    name: search TLC
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install the backend the checker imports
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check the model, then require each break flag to exit 1
        run: |
          python3 verification/search/check.py
          set +e
          python3 verification/search/check.py --break-provider
          provider_status=$?
          python3 verification/search/check.py --break-model
          model_status=$?
          set -e
          test "$provider_status" -eq 1
          test "$model_status" -eq 1
