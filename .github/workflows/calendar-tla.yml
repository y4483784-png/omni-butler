name: calendar model

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  tlc:
    name: calendar TLC
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Check the model, then require each break flag to exit 1
        run: |
          python3 verification/calendar/check.py
          set +e
          python3 verification/calendar/check.py --break-success
          success_status=$?
          python3 verification/calendar/check.py --break-second-insert
          second_status=$?
          python3 verification/calendar/check.py --break-lookup-insert
          lookup_status=$?
          python3 verification/calendar/check.py --break-written-complete
          written_status=$?
          set -e
          test "$success_status" -eq 1
          test "$second_status" -eq 1
          test "$lookup_status" -eq 1
          test "$written_status" -eq 1
