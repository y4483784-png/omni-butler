name: talk model

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  tlc:
    name: talk TLC
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Check the talk model
        run: python3 verification/talk/check.py
