# Alembic config. DB URL is taken from app settings (backend/.env) in alembic/env.py.
# Keep this file ASCII-only: alembic reads it with the OS locale encoding (GBK on zh-CN Windows).
[alembic]
script_location = alembic
prepend_sys_path = .
# URL placeholder only; env.py overrides with settings.database_url
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
